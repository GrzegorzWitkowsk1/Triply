services:
  mongo:
    image: mongo:7
    container_name: triply-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "try { rs.status(); } catch (error) { if (error.codeName !== 'NotYetInitialized') throw error; rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27018'}]}); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  mongo_data:
